<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мої повідомлення</title>
    <link rel="stylesheet" href="./style/main.css" />
  </head>
  <body>
    <main class="page">
      <div class="container">
        <section class="intro">
          <p class="intro__label">Журнал пригод</p>
          <h1 class="intro__title">Мої повідомлення</h1>
          <p class="intro__text">Тут зібрані новини, нагороди й важливі сповіщення про твої місії</p>
        </section>
        <section class="alerts">
          <div class="alert alert--info">
            <button class="alert__close" type="button" aria-label="Закрити">×</button>
            <h2 class="alert__title">Інформація</h2>
            <p class="alert__text">Нова місія вже доступна</p>
          </div>
          <div class="alert alert--success">
            <button class="alert__close" type="button" aria-label="Закрити">×</button>
            <h2 class="alert__title">Місію виконано</h2>
            <p class="alert__text">Ти отримав 250 XP</p>
          </div>
          <div class="alert alert--warning">
            <button class="alert__close" type="button" aria-label="Закрити">×</button>
            <h2 class="alert__title">Попередження</h2>
            <p class="alert__text">Перевір спорядження перед початком місі.</p>
          </div>
          <div class="alert alert--error">
            <button class="alert__close" type="button" aria-label="Закрити">×</button>
            <h2 class="alert__title">Помилка</h2>
            <p class="alert__text">Не вдалося зберегти результат</p>
          </div>
          <button class="alerts__button" type="button">Очистити всі повідомлення</button>
        </section>
      </div>
    </main>
  </body>
</html>
